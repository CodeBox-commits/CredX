[project]
name = "credx-backend"
version = "1.0.0"
description = "CredX API: document ingestion, research, fraud graph, explainable scoring, CAM and copilot"
requires-python = ">=3.11"

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]  # long lines reviewed manually; FastAPI uses calls in defaults; zip lengths are checked by construction

[tool.ruff.lint.isort]
known-first-party = ["ai", "api", "cam", "config", "core", "database", "extraction", "fraud", "middleware", "models",
                     "research", "schemas", "scoring", "services", "utils", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
